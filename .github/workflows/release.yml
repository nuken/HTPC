name: Build and Release Nucleus HTPC

# This tells GitHub to run the workflow when you push a version tag (like v1.0.0)
# or when you manually click the "Run workflow" button in the GitHub UI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Installer
    runs-on: windows-latest
    
    # Required permission to let the bot create a Release on your repository
    permissions:
      contents: write 

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: ⚙️ Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🔨 Publish .NET Application
        run: dotnet publish -c Release -r win-x64 --self-contained true
        
      - name: 📦 Compile Inno Setup Installer
        # Fun fact: GitHub's Windows runners have Inno Setup pre-installed!
        run: iscc HTPC.iss

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        # Only create the release if this was triggered by a tag
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Make sure this filename matches exactly what HTPC.iss outputs!
          files: Output/NucleusHTPC_Installer_v1.1.1.exe
          generate_release_notes: true